<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register — DriveX</title>
  <link rel="stylesheet" href="/css/style.css" />
  <style>
    .auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      background: radial-gradient(ellipse 60% 60% at 50% 50%, rgba(232,255,71,0.04) 0%, transparent 70%);
    }
    .auth-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 48px 44px;
      width: 100%;
      max-width: 420px;
    }
    .auth-logo { font-family: 'Syne', sans-serif; font-size: 24px; font-weight: 800; margin-bottom: 32px; }
    .auth-logo span { color: var(--accent); }
    .auth-form { display: flex; flex-direction: column; gap: 16px; }
  </style>
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">Drive<span>X</span></div>
    <h1 style="font-size:28px;font-weight:800;margin-bottom:6px">Create Account</h1>
    <p style="color:var(--muted);font-size:14px;margin-bottom:32px">Join DriveX and start booking today</p>

    <div id="alert-box"></div>

    <div class="auth-form">
      <div class="form-group">
        <label>Full Name</label>
        <input class="form-control" type="text" id="name" placeholder="Rahul Sharma" />
      </div>
      <div class="form-group">
        <label>Email</label>
        <input class="form-control" type="email" id="email" placeholder="you@example.com" />
      </div>
      <div class="form-group">
        <label>Phone (optional)</label>
        <input class="form-control" type="tel" id="phone" placeholder="+91 98765 43210" />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input class="form-control" type="password" id="password" placeholder="Min 6 characters" />
      </div>
      <button class="btn btn-primary" onclick="register()" style="width:100%;margin-top:8px;padding:13px">Create Account →</button>
    </div>

    <div style="text-align:center;margin-top:24px;font-size:13px;color:var(--muted)">
      Already have an account? <a href="/login" style="color:var(--accent);font-weight:500">Login</a>
    </div>
  </div>
</div>

<div id="toast"></div>
<script src="/js/app.js"></script>
<script>
  if (isLoggedIn()) window.location.href = '/';

  async function register() {
    const alertBox = document.getElementById('alert-box');
    const name = document.getElementById('name').value.trim();
    const email = document.getElementById('email').value.trim();
    const phone = document.getElementById('phone').value.trim();
    const password = document.getElementById('password').value;

    if (!name || !email || !password) {
      alertBox.innerHTML = '<div class="alert alert-error">Name, email, and password are required.</div>';
      return;
    }

    if (password.length < 6) {
      alertBox.innerHTML = '<div class="alert alert-error">Password must be at least 6 characters.</div>';
      return;
    }

    try {
      const data = await api('/auth/register', { method: 'POST', body: { name, email, phone, password } });
      localStorage.setItem('token', data.token);
      localStorage.setItem('user', JSON.stringify(data.user));
      toast('Account created! Welcome to DriveX 🎉');
      setTimeout(() => window.location.href = '/', 800);
    } catch (err) {
      alertBox.innerHTML = `<div class="alert alert-error">${err.message}</div>`;
    }
  }
</script>
</body>
</html>
