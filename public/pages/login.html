<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — DriveX</title>
  <link rel="stylesheet" href="/css/style.css" />
  <style>
    .auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      background: radial-gradient(ellipse 60% 60% at 50% 50%, rgba(232,255,71,0.04) 0%, transparent 70%);
    }

    .auth-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 48px 44px;
      width: 100%;
      max-width: 420px;
    }

    .auth-logo {
      font-family: 'Syne', sans-serif;
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 32px;
    }

    .auth-logo span { color: var(--accent); }

    .auth-title {
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .auth-sub { color: var(--muted); font-size: 14px; margin-bottom: 32px; }

    .auth-form { display: flex; flex-direction: column; gap: 16px; }

    .auth-footer {
      text-align: center;
      margin-top: 24px;
      font-size: 13px;
      color: var(--muted);
    }

    .auth-footer a { color: var(--accent); font-weight: 500; }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--muted);
      font-size: 12px;
      margin: 4px 0;
    }

    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }
  </style>
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">Drive<span>X</span></div>
    <h1 class="auth-title">Welcome back</h1>
    <p class="auth-sub">Login to manage your bookings</p>

    <div id="alert-box"></div>

    <div class="auth-form">
      <div class="form-group">
        <label>Email</label>
        <input class="form-control" type="email" id="email" placeholder="you@example.com" />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input class="form-control" type="password" id="password" placeholder="••••••••" onkeydown="if(event.key==='Enter')login()" />
      </div>
      <button class="btn btn-primary" onclick="login()" style="width:100%;margin-top:8px;padding:13px">Login →</button>
    </div>

    <div class="divider" style="margin-top:24px">or</div>

    <div class="auth-footer">
      <p>Don't have an account? <a href="/register">Register free</a></p>
    </div>
  </div>
</div>

<div id="toast"></div>
<script src="/js/app.js"></script>
<script>
  // If already logged in, redirect
  if (isLoggedIn()) window.location.href = '/';

  async function login() {
    const alertBox = document.getElementById('alert-box');
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    if (!email || !password) {
      alertBox.innerHTML = '<div class="alert alert-error">Please enter email and password.</div>';
      return;
    }

    try {
      const data = await api('/auth/login', { method: 'POST', body: { email, password } });
      localStorage.setItem('token', data.token);
      localStorage.setItem('user', JSON.stringify(data.user));

      toast('Login successful! Redirecting…');
      setTimeout(() => {
        window.location.href = data.user.role === 'admin' ? '/admin' : '/';
      }, 800);
    } catch (err) {
      alertBox.innerHTML = `<div class="alert alert-error">${err.message}</div>`;
    }
  }
</script>
</body>
</html>
